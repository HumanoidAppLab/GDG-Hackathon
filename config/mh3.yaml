# The starter scene contains the MH3 and a floor plane at z=0.
robot_usd: ../assets/MH3.usd
backend: auto
dt: 0.01
realtime: true
show_viewer: true
gravity: [0.0, 0.0, -9.81]
spawn_position: [0.0, 0.0, 0.0]
spawn_euler_deg: [0.0, 0.0, 0.0]
position_kp: 350.0
position_kv: 35.0
enable_gravity_compensation: true

# Joint-specific gains reflect the physical actuator power distribution.
# Shoulder and elbow pitch actuators carry substantial cantilever loads and receive higher stiffness.
joint_kp:
  left_1: 800.0
  left_2: 800.0
  left_3: 500.0
  left_4: 800.0
  left_5: 500.0
  left_6: 300.0
  left_7: 300.0
  right_1: 800.0
  right_2: 800.0
  right_3: 500.0
  right_4: 800.0
  right_5: 500.0
  right_6: 300.0
  right_7: 300.0
  head_yaw: 200.0
  head_pitch: 200.0

joint_kv:
  left_1: 80.0
  left_2: 80.0
  left_3: 50.0
  left_4: 80.0
  left_5: 50.0
  left_6: 30.0
  left_7: 30.0
  right_1: 80.0
  right_2: 80.0
  right_3: 50.0
  right_4: 80.0
  right_5: 50.0
  right_6: 30.0
  right_7: 30.0
  head_yaw: 20.0
  head_pitch: 20.0

slider_position_kp: 350000.0
slider_position_kv: 4000.0
slider_max_velocity_mps: 0.008
slider_max_reference_lead_m: 0.015
slider_max_force_n: 400.0
wheel_radius_m: 0.1
wheel_separation_m: 0.45
max_linear_velocity_mps: 0.6
max_angular_velocity_radps: 2.0
dashboard_camera_fps: 20.0
drive_command_timeout_s: 0.3

# The ready home pose holds both forearms forward, levels the end effectors, and points the head forward.
initial_positions:
  head_yaw: 0.0
  head_pitch: 0.0
  left_1: 0.0
  left_2: 0.0
  left_3: 0.0
  left_4: 0.75
  left_5: 0.0
  left_6: 0.0
  left_7: 0.0
  right_1: 0.0
  right_2: 0.0
  right_3: 0.0
  right_4: 0.65
  right_5: 0.0
  right_6: 0.0
  right_7: 0.0

# These transforms come from camera prims authored in the bundled MH3 USD.
# Genesis cameras look along local -Z with local +Y up, matching USD cameras.
cameras:
  - name: base_left
    parent_link: mobile_base
    enabled: true
    fps: 20.0
    rgb_format: jpeg
    rgb_quality: 80
    include_depth: true
    depth_format: jpeg
    depth_quality: 85
    width: 640
    height: 360
    vertical_fov_deg: 54.0
    transform:
      - [0.0, 0.0, -1.0, 0.302159]
      - [-1.0, 0.0, 0.0, 0.060000]
      - [0.0, 1.0, 0.0, 0.106314]
      - [0.0, 0.0, 0.0, 1.0]
  - name: base_right
    parent_link: mobile_base
    enabled: true
    fps: 20.0
    rgb_format: jpeg
    rgb_quality: 80
    include_depth: false
    depth_format: jpeg
    depth_quality: 85
    width: 640
    height: 360
    vertical_fov_deg: 54.0
    transform:
      - [0.0, 0.0, -1.0, 0.302159]
      - [-1.0, 0.0, 0.0, -0.060000]
      - [0.0, 1.0, 0.0, 0.106314]
      - [0.0, 0.0, 0.0, 1.0]
  - name: head_left
    parent_link: head_camera_mount
    enabled: true
    fps: 20.0
    rgb_format: jpeg
    rgb_quality: 80
    include_depth: true
    depth_format: jpeg
    depth_quality: 85
    width: 640
    height: 360
    vertical_fov_deg: 54.0
    transform:
      - [0.0, 0.0, -1.0, 0.119917]
      - [-0.00009623, 1.0, 0.0, 0.042416]
      - [1.0, 0.00009623, 0.0, -0.024999]
      - [0.0, 0.0, 0.0, 1.0]
  - name: head_right
    parent_link: head_camera_mount
    enabled: true
    fps: 20.0
    rgb_format: jpeg
    rgb_quality: 80
    include_depth: false
    depth_format: jpeg
    depth_quality: 85
    width: 640
    height: 360
    vertical_fov_deg: 54.0
    transform:
      - [0.0, 0.0, -1.0, 0.119917]
      - [-0.00009623, 1.0, 0.0, 0.042412]
      - [1.0, 0.00009623, 0.0, 0.025001]
      - [0.0, 0.0, 0.0, 1.0]
